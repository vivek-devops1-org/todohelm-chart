apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-get-task-service
spec:
  type: ClusterIP
  selector:
    app-name: {{ .Release.Name }}-gettask
  ports:
    - protocol: TCP
      port: {{ .Values.getTask.servicePort }}  # service ka port jis par listen karega
      targetPort: {{ .Values.getTask.containerPort }}  #container port