apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gettask-ingress
  labels:
    app.kubernetes.io/name: myingress
spec:
  ingressClassName: {{ .Values.common.ingressClass }}
  rules:
  - host: {{ .Values.getTask.host }}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Release.Name }}-gettask-service #service name mean Loadbalancer service ka naam, yha cluster ip type LB ko add kar rahe
            port: 
              number: {{ .Values.getTask.servicePort }} #service ka portnumber
