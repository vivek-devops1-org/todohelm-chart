apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
spec:
  type: ClusterIP
  selector:
    app-name: {{ .Release.Name }}-ui
  ports:
    - protocol: TCP
      port: {{ .Values.UI.servicePort }}  # service ka port jis par listen karega
      targetPort: {{ .Values.UI.containerPort }}  #container port