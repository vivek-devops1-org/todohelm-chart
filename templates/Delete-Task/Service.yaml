apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-delete-task-service
spec:
  type: ClusterIP
  selector:
    app-name: {{ .Release.Name }}-deletetask
  ports:
    - protocol: TCP
      port: {{ .Values.deleteTask.servicePort }}  # service ka port jis par listen karega
      targetPort: {{ .Values.deleteTask.containerPort }}  #container port