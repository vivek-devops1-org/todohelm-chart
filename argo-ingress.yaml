apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-ingress
  namespace: todo-argocd
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: argo-cd.kulphi.shop
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80