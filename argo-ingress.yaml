apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-ingress
  namespace: argocd
spec:
  # ingressClassName: azure-application-gateway
  ingressClassName: nginx
  rules:
  - host: argo-example.kulphi.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: argocd-server #(agar argocd par chalana hei to argocd ka server dena hoga esko kubectl get svc -n todo-argocd(namespace) se check kar sakte ho)service name mean Loadbalancer service ka naam, yha cluster ip type LB ko add kar rahe
            port: 
              number: 80 #service ka portnumber